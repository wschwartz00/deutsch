<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#132430">
<title>Deutsch Schritt für Schritt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&family=Barlow:wght@500;600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Concept: a German city you are learning to live in.
   - The dashboard opens on a street that follows the real time of day (Guten Morgen / Tag / Abend / Nacht).
   - The learning path is a transit line: units are stations, you are the tram.
   - New words arrive on a street-name plate; dialogues are speech bubbles, Ana (the learner) on the right.
   Boldness lives in the hero street and the line map; everything else stays quiet. */
:root {
  --paper: #F1F3EF;
  --card: #FFFFFF;
  --card-2: #E7EBE6;
  --ink: #15222B;
  --muted: #56636B;
  --rule: #D4DAD3;
  --night: #132430;
  --night-2: #1D3442;
  --night-ink: #E6EEF1;
  --night-muted: #93A9B4;
  --signal: #FFC21A;
  --signal-ink: #261C00;
  --tram: #F2C230;
  --ok: #18794E; --ok-bg: #E1F3E8;
  --bad: #B4232A; --bad-bg: #FBE6E7;
  --hl: #FFE58A;
  --me: #FFF3C9;
  --m: #1F5FD6; --f: #C42626; --n: #0E8A72; --pl: #7B3FD1;
  --scene-bg: #E2E7E3;
  --font-sign: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-de: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 18px;
  --lift: 0 1px 0 rgba(21, 34, 43, .04), 0 10px 30px -12px rgba(21, 34, 43, .22);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E171D; --card: #16232B; --card-2: #1F2F38; --ink: #E5ECEF; --muted: #9AABB2; --rule: #293A43;
    --night: #0A161D; --night-2: #142631; --night-ink: #E2ECF0; --night-muted: #8BA2AD;
    --signal: #FFC93D; --signal-ink: #231A00; --ok: #4FD08D; --ok-bg: #12301F; --bad: #FF8A8F; --bad-bg: #3A191C; --hl: #6B5A10; --me: #3A3210;
    --m: #5A8FF0; --f: #EE5A5A; --n: #14A88A; --pl: #A07BF0; --scene-bg: #22323A;
    --lift: 0 10px 30px -12px rgba(0,0,0,.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E171D; --card: #16232B; --card-2: #1F2F38; --ink: #E5ECEF; --muted: #9AABB2; --rule: #293A43;
  --night: #0A161D; --night-2: #142631; --night-ink: #E2ECF0; --night-muted: #8BA2AD;
  --signal: #FFC93D; --signal-ink: #231A00; --ok: #4FD08D; --ok-bg: #12301F; --bad: #FF8A8F; --bad-bg: #3A191C; --hl: #6B5A10; --me: #3A3210;
  --m: #5A8FF0; --f: #EE5A5A; --n: #14A88A; --pl: #A07BF0; --scene-bg: #22323A;
  --lift: 0 10px 30px -12px rgba(0,0,0,.6); color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3, .sign-t { font-family: var(--font-sign); line-height: 1.02; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2.2rem, 5vw, 3.3rem); font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: 1.6rem; font-weight: 700; }
h3 { font-size: 1.22rem; font-weight: 700; }
p { margin: 0; }
.eyebrow { font-size: .92rem; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); } .small { font-size: .9rem; } .tiny { font-size: .8rem; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; } .stack-s { display: grid; gap: 6px; }

/* ================= shell ================= */
.shell { min-height: 100%; display: grid; grid-template-columns: 1fr; }
.side { display: none; }
.page { width: 100%; max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 120px; display: grid; gap: 26px; align-content: start; min-width: 0; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-sign); font-weight: 800; font-size: 1.2rem; color: inherit; white-space: nowrap; }
.brand .mark { width: 36px; height: 36px; border-radius: 10px; background: var(--signal); color: var(--signal-ink); display: grid; place-items: center; flex: none; }
.brand .mark svg { width: 20px; height: 20px; }
.brand small { display: block; font-family: var(--font-body); font-weight: 400; font-size: .74rem; opacity: .7; }
.who-chip { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--rule); background: var(--card); border-radius: 999px; padding: 4px 12px 4px 4px; font-weight: 700; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-sign); font-weight: 800; color: #fff; flex: none; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--night); color: var(--night-ink);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
nav.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
nav.tabs button { background: none; border: 0; border-radius: 12px; padding: 7px 2px; font-size: .78rem; font-weight: 700; color: var(--night-muted); display: grid; justify-items: center; gap: 2px; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--signal); }
.badge { background: var(--signal); color: var(--signal-ink); border-radius: 999px; padding: 0 7px; font-size: .74rem; font-weight: 800; }
@media (max-width: 959px) { .topbar .brand small { display: none; } .topbar .brand { font-size: 1.08rem; } }
@media (max-width: 380px) { .topbar .brand > span:last-child { display: none; } }
@media (min-width: 960px) {
  .shell { grid-template-columns: 252px 1fr; }
  .side { display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; padding: 24px 16px; background: var(--night); color: var(--night-ink); }
  .side nav { display: grid; gap: 2px; }
  .side .group { font-size: .82rem; color: var(--night-muted); padding: 16px 12px 6px; font-weight: 700; }
  .side nav button { display: flex; align-items: center; gap: 12px; border: 0; background: none; border-radius: 12px; padding: 11px 12px; font-weight: 700; color: var(--night-muted); text-align: left; }
  .side nav button svg { width: 20px; height: 20px; }
  .side nav button:hover { background: var(--night-2); color: var(--night-ink); }
  .side nav button[aria-current="page"] { background: var(--night-2); color: var(--signal); box-shadow: inset 3px 0 0 var(--signal); }
  .side .foot { margin-top: auto; display: grid; gap: 10px; }
  .side .who-chip { background: var(--night-2); border-color: transparent; color: var(--night-ink); width: 100%; }
  .side .who-chip .muted { color: var(--night-muted); }
  nav.tabs { display: none; }
  .topbar { display: none; }
  .page { padding-block: 30px 64px; padding-inline: 40px; }
}

/* ================= surfaces ================= */
.card { background: var(--card); border: 1px solid var(--rule); border-radius: var(--r); padding: 22px; display: grid; gap: 14px; min-width: 0; align-content: start; }
.btn { border: 0; border-radius: 14px; padding: 13px 22px; font-weight: 700; background: var(--ink); color: var(--paper); min-height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
.btn.accent { background: var(--signal); color: var(--signal-ink); box-shadow: 0 3px 0 #C99400; }
.btn.accent:active { transform: translateY(2px); box-shadow: 0 1px 0 #C99400; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--rule); }
.btn.ghost:hover { border-color: var(--ink); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; box-shadow: none; }
.btn svg { width: 18px; height: 18px; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-weight: 700; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--card-2); font-size: .8rem; font-weight: 700; color: var(--muted); }
.iconbtn { width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid var(--rule); background: var(--card); display: inline-grid; place-items: center; flex: none; color: var(--ink); }
.iconbtn:hover { border-color: var(--ink); }
.iconbtn svg { width: 19px; height: 19px; }
.iconbtn.sm { width: 34px; height: 34px; } .iconbtn.sm svg { width: 16px; height: 16px; }

/* ================= article colours ================= */
.g-m { color: var(--m); } .g-f { color: var(--f); } .g-n { color: var(--n); } .g-pl { color: var(--pl); }
.artb { font-weight: 700; white-space: nowrap; }
.artb .sym { font-size: .62em; margin-right: 4px; vertical-align: .16em; }
body.symbols .artb .sym { font-size: 1em; }

/* ================= German text + lens ================= */
.de { font-family: var(--font-de); font-weight: 500; font-size: 1.25rem; line-height: 1.42; }
.w { cursor: pointer; border-radius: 5px; padding: 0 1px; border-bottom: 1.5px dotted color-mix(in srgb, var(--muted) 60%, transparent); }
.w:hover { background: color-mix(in srgb, var(--signal) 25%, transparent); }
.w.on { background: var(--hl); }
.w.g-m, .w.g-f, .w.g-n, .w.g-pl { font-weight: 600; }
.tr { color: var(--muted); font-size: .93rem; margin-top: 2px; }

/* dialogue as speech bubbles; Ana (the learner) speaks from the right */
.talk { display: grid; gap: 14px; }
.line { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: end; }
.line .face { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; background: var(--card-2); border: 2px solid var(--card); box-shadow: 0 0 0 1px var(--rule); }
.line .face svg { width: 100%; height: 100%; display: block; }
.bubble { background: var(--card); border: 1px solid var(--rule); border-radius: 18px 18px 18px 6px; padding: 10px 14px 8px; min-width: 0; justify-self: start; max-width: min(100%, 520px); box-shadow: 0 1px 0 var(--rule); }
.bubble .who { font-size: .8rem; font-weight: 700; color: var(--muted); margin-bottom: 2px; }
.bubble .tools { display: flex; gap: 6px; justify-content: flex-end; margin-top: 6px; }
.bubble .tools .iconbtn { width: 30px; height: 30px; background: transparent; border-color: color-mix(in srgb, var(--muted) 30%, transparent); } .bubble .tools .iconbtn svg { width: 14px; height: 14px; }
.line.me { grid-template-columns: minmax(0, 1fr) 44px; }
.line.me .face { order: 2; } .line.me .bubble { order: 1; justify-self: end; background: var(--me); border-color: color-mix(in srgb, var(--signal) 45%, var(--rule)); border-radius: 18px 18px 6px 18px; }
.line.nar { grid-template-columns: minmax(0, 1fr); }
.line.nar .bubble { background: transparent; border: 0; box-shadow: none; border-left: 3px solid var(--rule); border-radius: 0; padding: 2px 0 2px 14px; max-width: 100%; display: flex; gap: 10px; align-items: center; justify-content: space-between; width: 100%; }
.line.nar .bubble .tools { margin-top: 0; }
.line.nar .de { font-style: italic; }
.line.playing .bubble { box-shadow: 0 0 0 3px color-mix(in srgb, var(--signal) 70%, transparent); }
.line.nar.playing .bubble { box-shadow: none; border-left-color: var(--signal); }

/* ================= scenes ================= */
.scene { background: var(--scene-bg); border-radius: var(--r); overflow: hidden; line-height: 0; box-shadow: var(--lift); }
.scene svg { width: 100%; height: auto; display: block; max-height: 360px; }
.cover { background: var(--scene-bg); line-height: 0; overflow: hidden; }
.cover svg { width: 100%; height: 100%; display: block; }

/* ================= picker ================= */
.picker { min-height: 100%; display: grid; grid-template-rows: auto 1fr; }
.picker .street { position: relative; height: clamp(240px, 42vh, 420px); overflow: hidden; background: var(--night); }
.picker .street svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.picker .street .brand { position: absolute; left: max(20px, env(safe-area-inset-left, 0px)); top: 18px; color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.4); }
.picker .in { width: 100%; max-width: 820px; margin: -70px auto 0; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 18px; position: relative; }
.picker .ask { background: var(--card); border-radius: 22px; padding: 26px; box-shadow: var(--lift); display: grid; gap: 18px; }
.profiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.pcard { background: var(--paper); border: 1.5px solid var(--rule); border-radius: 16px; padding: 16px; display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; text-align: left; }
.pcard:hover { border-color: var(--ink); }
.pcard .avatar { width: 52px; height: 52px; font-size: 1.4rem; }
.pcard .nm { font-family: var(--font-sign); font-weight: 800; font-size: 1.5rem; display: block; line-height: 1.1; }

/* ================= today: street hero ================= */
.hero { position: relative; border-radius: 26px; overflow: hidden; min-height: 400px; background: var(--night); color: #fff; display: grid; align-items: end; box-shadow: var(--lift); }
.hero > .bg { position: absolute; inset: 0; }
.hero > .bg svg { width: 100%; height: 100%; display: block; }
.hero > .bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10, 20, 28, .82) 0%, rgba(10, 20, 28, .55) 42%, rgba(10, 20, 28, 0) 75%), linear-gradient(0deg, rgba(10, 20, 28, .55), rgba(10, 20, 28, 0) 45%); }
.hero .in { position: relative; padding: 30px; display: grid; gap: 18px; max-width: 620px; }
.hero .when { font-weight: 700; color: rgba(255, 255, 255, .8); }
.hero h1 { font-size: clamp(2.6rem, 6.4vw, 4.4rem); color: #fff; }
.hero .next { background: var(--card); color: var(--ink); border-radius: 18px; padding: 18px; display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; box-shadow: 0 18px 40px -18px rgba(0,0,0,.6); }
.hero .next .gleis { width: 58px; height: 58px; border-radius: 14px; background: var(--night); color: var(--signal); display: grid; place-items: center; font-family: var(--font-sign); font-weight: 800; font-size: 1.6rem; line-height: 1; }
.hero .next .gleis small { display: block; font-size: .6rem; font-weight: 700; color: var(--night-muted); text-align: center; }
.hero .next h2 { font-size: 1.7rem; }
.hero .next .act { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.hero .goal { position: absolute; top: 22px; right: 22px; display: grid; grid-template-columns: auto auto; gap: 10px; align-items: center; background: rgba(10, 20, 28, .55); backdrop-filter: blur(6px); border-radius: 16px; padding: 10px 14px 10px 10px; }
.hero .goal b { font-family: var(--font-sign); font-size: 1.5rem; line-height: 1; display: block; }
.hero .goal span { font-size: .8rem; color: rgba(255,255,255,.8); }
.ring { width: 54px; height: 54px; }
@media (max-width: 640px) {
  .hero { min-height: 0; border-radius: 22px; }
  .hero > .bg { position: relative; height: 190px; }
  .hero > .bg svg { height: 190px; }
  .hero > .bg::after { background: linear-gradient(0deg, var(--night) 0%, rgba(10,20,28,0) 60%); }
  .hero .in { padding: 0 18px 18px; margin-top: -54px; }
  .hero h1 { font-size: 2.5rem; }
  .hero .goal { top: 14px; right: 14px; }
}

/* ================= the line (path as a transit line) ================= */
.linie { background: var(--night); color: var(--night-ink); border-radius: var(--r); padding: 20px 22px 18px; display: grid; gap: 12px; }
.linie .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.linie .head h3 { color: var(--night-ink); }
.linie .head .linebadge { display: inline-flex; align-items: center; gap: 8px; }
.linebadge i { font-style: normal; font-family: var(--font-sign); font-weight: 800; background: var(--signal); color: var(--signal-ink); border-radius: 6px; padding: 1px 8px; }
.linie .track { overflow-x: auto; padding-bottom: 6px; }
.linie ol { list-style: none; margin: 0; padding: 26px 8px 4px; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(92px, 1fr); position: relative; min-width: 760px; }
.linie li { position: relative; display: grid; justify-items: center; gap: 8px; text-align: center; font-size: .8rem; color: var(--night-muted); }
.linie li::before { content: ""; position: absolute; top: 9px; left: -50%; right: 50%; height: 6px; background: var(--night-2); }
.linie li:first-child::before { display: none; }
.linie li.done::before, .linie li.cur::before { background: var(--signal); }
.linie .dotx { position: relative; z-index: 1; width: 24px; height: 24px; border-radius: 50%; background: var(--night); border: 5px solid var(--night-2); }
.linie li.done .dotx { border-color: var(--signal); background: var(--signal); }
.linie li.cur .dotx { border-color: var(--signal); background: var(--night); box-shadow: 0 0 0 5px color-mix(in srgb, var(--signal) 30%, transparent); }
.linie li.ready { color: var(--night-ink); }
.linie li b { font-family: var(--font-sign); font-size: .95rem; color: inherit; }
.linie .tramtag { position: absolute; top: -26px; left: 50%; transform: translateX(-50%); background: var(--signal); color: var(--signal-ink); font-family: var(--font-sign); font-weight: 800; font-size: .78rem; border-radius: 6px; padding: 1px 8px; white-space: nowrap; }
.linie li button { all: unset; cursor: pointer; display: grid; justify-items: center; gap: 8px; }
.linie li button:focus-visible { outline: 3px solid var(--signal); outline-offset: 4px; border-radius: 8px; }

/* ================= dashboard grid ================= */
.dash { display: grid; gap: 24px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 1120px) { .dash { grid-template-columns: minmax(0, 1fr) 330px; } }
.units { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
.ucard { background: var(--card); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; display: grid; grid-template-rows: 170px auto; text-align: left; padding: 0; box-shadow: var(--lift); transition: transform .15s ease; }
.ucard:hover:not(:disabled) { transform: translateY(-2px); }
.ucard .cover { height: 170px; position: relative; }
.ucard .cover svg { height: 170px; width: 100%; }
.ucard .cover .num { position: absolute; left: 14px; top: 14px; background: var(--night); color: var(--signal); font-family: var(--font-sign); font-weight: 800; border-radius: 8px; padding: 2px 10px; line-height: 1.4; }
.ucard .body { padding: 16px 18px 18px; display: grid; gap: 8px; }
.ucard:disabled { opacity: .55; cursor: default; }
.story-tile { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); background: var(--card); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; text-align: left; padding: 0; box-shadow: var(--lift); }
.story-tile .cover svg { height: 100%; min-height: 200px; }
.story-tile .body { padding: 22px; display: grid; gap: 10px; align-content: center; }
.story-tile:disabled { opacity: .6; cursor: default; }
@media (max-width: 640px) { .story-tile { grid-template-columns: 1fr; } .story-tile .cover svg { min-height: 0; height: 170px; } }
.bar-s { height: 6px; background: var(--card-2); border-radius: 99px; overflow: hidden; } .bar-s i { display: block; height: 100%; background: var(--ok); border-radius: 99px; }
.panel { background: var(--card); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
.panel > header { padding: 18px 20px 6px; }
.panel .sec { padding: 14px 20px; border-top: 1px solid var(--rule); display: grid; gap: 10px; }
.panel .sec:first-of-type { border-top: 0; }
.listrow { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 20px; border: 0; border-top: 1px solid var(--rule); background: none; text-align: left; width: 100%; }
.listrow:hover:not(:disabled) { background: var(--card-2); }
.ico { width: 40px; height: 40px; border-radius: 12px; background: var(--card-2); display: grid; place-items: center; color: var(--ink); }
.ico svg { width: 20px; height: 20px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font-size: .76rem; color: var(--muted); font-weight: 700; }
.week i { display: block; height: 30px; border-radius: 8px; margin-top: 4px; background: var(--card-2); }
